name: Pipeline Lunaria

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4
      - name: Correr pruebas automaticas
        run: bash pruebas.sh
      - name: Usar la llave secreta
        env:
          LUNARIA_API_KEY: ${{ secrets.LUNARIA_API_KEY }}
        run: |
          echo "Intento imprimir la llave: $LUNARIA_API_KEY"
          echo "La llave tiene ${#LUNARIA_API_KEY} caracteres"

  desplegar:
    needs: pruebas
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Empaquetar el sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4